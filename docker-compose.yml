services:
    db:
        container_name: spending-tracker-db
        restart: unless-stopped
        image: 'postgres:16-alpine'
        environment:
            POSTGRES_USER: spending_tracker
            POSTGRES_PASSWORD: spending_tracker
            POSTGRES_DB: spending_tracker
        volumes:
            - 'spending-tracker-db-data:/var/lib/postgresql/data'

    webserver:
        container_name: spending-tracker-webserver
        restart: unless-stopped
        image: 'nginx:alpine'
        working_dir: /application
        volumes:
            - '.:/application'
            - './phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
        ports:
            - '26000:80'

    php-fpm:
        container_name: spending-tracker-php-fpm
        restart: unless-stopped
        build: phpdocker/php-fpm
        working_dir: /application
        depends_on:
            - db
        volumes:
            - '.:/application'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.5/fpm/conf.d/99-overrides.ini'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.5/cli/conf.d/99-overrides.ini'

volumes:
    spending-tracker-db-data:
